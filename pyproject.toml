[project]
name = "secops-agent"
version = "1.0.3"
description = "🛡️ SecOps Agent - AI-Powered Pentesting & Red Team CLI with Premium TUI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "SecOps Team"},
]
keywords = ["security", "pentesting", "ai", "agent", "tui", "red-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "typer>=0.12.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
secops = "secops_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secops_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "scratch", ".secops_runs", "docs"]

[tool.ruff.lint]
# Correctness-focused gate (CI-blocking). The codebase carries a stylistic
# backlog (unused imports, lazy imports, etc.) that is burned down incrementally
# rather than auto-fixed in bulk — several "unused" imports are intentional
# side-effect/registration imports. See docs/ARCHITECTURE.md §8.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "F401",  # unused-import: many are intentional tool-registration / re-export imports
    "E402",  # module-import-not-at-top: legacy lazy/conditional imports
    "E741",  # ambiguous-variable-name: cosmetic backlog
    "F841",  # unused-variable: cleanup backlog
    "F541",  # f-string-missing-placeholders: cleanup backlog
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Note: the suite is unittest-style; the canonical runner remains
# `python -m unittest discover -s tests`. pytest is provided for convenience.
